<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 집안일</title>
<meta name="theme-color" content="#ffd9e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="집안일">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 말랑한 파스텔 집안일 판 — 다섯 마리 동물 친구(병아리·펭귄·여우·고슴도치·개구리)가 가족 한 명씩 */
:root{--bg:#fff8f3;--card:#ffffff;--ink:#3b2f35;--mut:#8a7a80;--line:#f3e3e3;--soft:#fff0ef;--pink:#ffd9e2;--pinkD:#f59ab3;--acc:#f06f93;--ok:#7cc79a}
@media(prefers-color-scheme:dark){:root{--bg:#1d1719;--card:#271f22;--ink:#fbeff2;--mut:#bba8ae;--line:#3a2e32;--soft:#2e2428;--pink:#4a2f39;--pinkD:#f59ab3;--acc:#ff8fae}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto}
h1{font:400 clamp(28px,7.5vw,42px)/1.1 Jua,sans-serif;margin:0;word-break:keep-all}
h2{font:400 24px/1.2 Jua,sans-serif;margin:28px 0 12px}
h3{font:400 21px/1.1 Jua,sans-serif;margin:0;flex:1}
.top{background:var(--pink);padding:calc(env(safe-area-inset-top) + 18px) max(4vw,16px) 16px;border-radius:0 0 28px 28px}
.top .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.date{margin:2px 0 0;color:var(--mut);font-weight:700}
.peek{display:flex;gap:2px;flex:none}.peek svg{width:34px;height:34px}
@media(max-width:430px){.peek svg{width:26px;height:26px}.peek svg:nth-child(n+4){display:none}}
.melabel{margin:14px 0 6px;font:400 15px Jua,sans-serif}
#me{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 14px 0 6px;border-radius:999px;border:2px solid transparent;background:var(--card);display:flex;align-items:center;gap:6px;font:400 17px Jua,sans-serif}
.chip svg{width:36px;height:36px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--c)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px max(4vw,16px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--soft);border-radius:18px;padding:5px}
nav button{min-height:46px;border:0;border-radius:14px;background:transparent;font:400 18px Jua,sans-serif;color:var(--mut)}
nav button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
main{padding:8px max(4vw,16px) 72px}
.wk{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:4px;align-items:center}
.wk>button{height:60px;border:0;background:transparent;font-size:26px;color:var(--mut);border-radius:12px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{position:relative;height:66px;border:0;border-radius:18px;background:var(--card);box-shadow:0 2px 0 var(--line);display:grid;place-content:center;text-align:center;line-height:1.1;overflow:hidden}
.day small{font-size:13px;color:var(--mut)}.day b{font:400 22px Jua,sans-serif;font-weight:400}
.day i{position:absolute;left:8px;right:8px;bottom:7px;height:5px;border-radius:9px;background:var(--line)}
.day i::after{content:"";position:absolute;inset:0;width:var(--p);border-radius:9px;background:var(--acc)}
.day[data-today] small{color:var(--acc);font-weight:700}
.day[aria-pressed=true]{background:var(--ink);color:var(--bg)}.day[aria-pressed=true] small{color:inherit}
.meter{display:flex;gap:16px;align-items:center;margin:16px 0 6px;padding:16px 18px;border-radius:24px;background:var(--card);box-shadow:0 3px 0 var(--line)}
.big{font-family:Jua,sans-serif;white-space:nowrap}.big b{font-weight:400;font-size:clamp(46px,12vw,60px);line-height:1}.big span{font-size:22px;color:var(--mut)}
.meter>div:last-child{flex:1}
.meter p{margin:0;font:400 18px Jua,sans-serif}.meter .sub{font:15px "Gowun Dodum";color:var(--mut)}
.bar{display:flex;height:16px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0}
.bar span{transition:width .3s}
.party{display:flex;justify-content:center;gap:4px;margin:4px 0 2px}.party svg{width:52px;height:52px;animation:hop 1s ease-in-out infinite}
.party svg:nth-child(2){animation-delay:.12s}.party svg:nth-child(3){animation-delay:.24s}.party svg:nth-child(4){animation-delay:.36s}.party svg:nth-child(5){animation-delay:.48s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.hint{font-size:15px;color:var(--mut);margin:10px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;margin-top:14px}
.who{border-radius:26px;padding:14px;background:var(--card);box-shadow:0 3px 0 var(--line)}
.who.mine{box-shadow:0 0 0 3px var(--cD),0 3px 0 var(--line)}
.who header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:52px;height:52px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}.av svg{width:46px;height:46px}
.who em{font:13px "Gowun Dodum";font-style:normal;background:var(--c);border-radius:99px;padding:2px 9px;vertical-align:middle}
.tally{font:400 17px Jua,sans-serif;color:var(--mut);white-space:nowrap}
.list{display:grid;gap:8px}
.chore{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:2px dashed var(--line);border-radius:18px;background:var(--card);text-align:left}
.box{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--cD);display:grid;place-items:center;flex:none;background:var(--card)}
.box svg{width:18px;height:18px}
.cn{flex:1;font-weight:700;line-height:1.3}.cn small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.pt{font:400 15px Jua,sans-serif;color:var(--mut);white-space:nowrap}
.chore[aria-pressed=true]{background:var(--c);border:2px solid transparent;color:#3b2f35}
.chore[aria-pressed=true] .box{background:#fff;border-color:#fff;animation:pop .3s}
.chore[aria-pressed=true] .nm{text-decoration:line-through;text-decoration-thickness:2px}
.chore[aria-pressed=true] .pt,.chore[aria-pressed=true] small{color:#6d5a61}
@keyframes pop{50%{transform:scale(1.3) rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.none{margin:6px 4px;color:var(--mut)}
.rows{display:grid;gap:10px}
.lb{display:grid;grid-template-columns:40px 4em minmax(0,1fr) 3.4em;gap:8px;align-items:center;font:400 17px Jua,sans-serif}
.lb svg{width:40px;height:40px}
.lb .track{height:24px;border-radius:99px;background:var(--soft);overflow:hidden}.lb .track span{display:block;height:100%;border-radius:99px}
.lb .n{text-align:right;white-space:nowrap}
.bal{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.bal div{border-radius:20px;padding:10px 12px;background:var(--c);color:#3b2f35;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 8px}
.bal svg{width:38px;height:38px;grid-row:span 2}.bal b{font:400 24px/1 Jua,sans-serif}.bal small{font-size:14px}
.rw{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);box-shadow:0 3px 0 var(--line)}
.rw .cn{font-size:17px}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--acc);color:#fff;font:400 17px Jua,sans-serif;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warn{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.log{margin:0;padding:0;list-style:none}.log li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.log span{flex:1}.log time{color:var(--mut);font-size:14px;white-space:nowrap}
.link{border:0;background:none;color:var(--acc);font-weight:700;min-height:44px;padding:0 6px}
.field{display:grid;gap:6px;margin-bottom:14px}.field>label,.field>span{font:400 15px Jua,sans-serif}
input[type=text],input[type=number]{width:100%;min-height:50px;font-size:17px;padding:0 14px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.mrow input{flex:1 1 140px}
.pick{display:flex;gap:4px}.pick button{width:46px;height:46px;border-radius:50%;border:2px solid transparent;background:var(--soft);padding:2px}
.pick button[aria-pressed=true]{border-color:var(--ink);background:var(--pink)}.pick svg{width:100%;height:100%}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{min-height:46px;min-width:46px;padding:0 13px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700}
.tg button[aria-pressed=true]{background:var(--c,var(--pink));border-color:var(--cD,var(--pinkD));color:#3b2f35}
.crow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.dots{display:flex}.dots svg{width:26px;height:26px;margin-left:-6px}
.form{background:var(--soft);border-radius:24px;padding:16px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.radd{display:grid;grid-template-columns:minmax(0,1fr) 6em auto;gap:8px;margin-top:12px}
.code{font:400 30px Jua,sans-serif;letter-spacing:.08em;background:var(--card);border-radius:18px;padding:10px 16px;display:inline-block;box-shadow:0 3px 0 var(--line)}
.citem{display:grid;gap:6px}
.deal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px 8px 14px;border-radius:16px;background:var(--soft);font-size:15px}
.deal>span{flex:1 1 160px}.deal b{font-family:Jua,sans-serif;font-weight:400;color:var(--acc)}
.deal.plain{background:none;padding:0;justify-content:flex-end}
.deal.form2{display:grid;padding:12px}.deal.form2 .radd{margin-top:2px}
.mini{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--acc);color:#fff;font:400 16px Jua,sans-serif;white-space:nowrap}
.mini.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.market{margin-top:14px;padding:14px 16px;border-radius:24px;background:var(--card);border:2px dashed var(--acc)}
.market h3{margin-bottom:4px}
.mrow2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.mrow2>span{flex:1}.mrow2 b{font-family:Jua,sans-serif;font-weight:400;color:var(--acc)}.mrow2 small{display:block;color:var(--mut);font-size:13px}
.bal.money div{grid-template-columns:1fr}.bal.money b{font-size:22px}
.rw .cn b{font-family:Jua,sans-serif;font-weight:400;color:var(--acc)}
.mini:disabled,.tg button:disabled{opacity:.35;cursor:default}
.playcard{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 3px 0 var(--line)}
.pbal{display:flex;align-items:center;gap:10px;margin-bottom:14px}.pbal svg{width:52px;height:52px}.pbal div{flex:1}.pbal small{display:block;color:var(--mut)}.pbal b{font:400 30px/1 Jua,sans-serif}
.left{font:400 15px Jua,sans-serif;background:var(--soft);border-radius:99px;padding:6px 12px;white-space:nowrap}
.playcard input[type=number]{margin-top:8px}
.result{display:grid;justify-items:center;gap:6px;margin-top:16px;padding:16px;border-radius:20px;background:var(--soft)}
.result p{margin:0;font:400 22px Jua,sans-serif}.result.win p{color:var(--acc)}.result.lose p{color:var(--mut)}
.coin{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f2b93b);display:grid;place-items:center;font:400 36px Jua,sans-serif;color:#7a5a12;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);animation:flip .6s ease-out}
.die{width:90px;height:90px;border-radius:20px;background:#fff;box-shadow:inset 0 -6px 0 #eadfe2,0 0 0 2px #eadfe2;display:grid;grid-template-columns:repeat(3,1fr);padding:12px;gap:4px;animation:roll .6s ease-out}
.die i{border-radius:50%}.die i.on{background:#3b2f35}
@keyframes flip{0%{transform:rotateY(0) scale(.6)}100%{transform:rotateY(1080deg) scale(1)}}
@keyframes roll{0%{transform:rotate(-200deg) scale(.5)}100%{transform:rotate(0) scale(1)}}
.log time.up{color:var(--acc);font-weight:700}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pet{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 10px;border-radius:24px;background:var(--c);color:#3b2f35}
.pet svg{width:72px;height:72px}.pet b{font:400 19px Jua,sans-serif;font-weight:400}.pet small{font-size:13px;color:#6d5a61;min-height:2.6em}
nav button{font-size:16px;padding:0 2px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(40,25,32,.45);display:grid;place-items:center;padding:20px}
.sheet{width:min(100%,360px);background:var(--card);border-radius:28px;padding:22px;text-align:center}
.sheet h3{margin:6px 0 4px}.sheet p{color:var(--mut);font-size:15px;margin:4px 0}.pinface svg{width:64px;height:64px}
#pinIn{width:100%;min-height:56px;font:400 30px Jua,sans-serif;letter-spacing:.5em;text-align:center;border:2px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0 2px}
#pinMsg{color:var(--acc)!important;min-height:1.4em}.sheet .acts{justify-content:center}
.mrow.other{gap:10px}.mrow.other .av{width:40px;height:40px}.mrow.other .av svg{width:36px;height:36px}
.homes button{display:flex;align-items:center;gap:4px;padding:0 12px 0 4px}.homes svg{width:34px;height:34px}
.house{--frame:#e9cdb4;position:relative;margin:14px auto 0;max-width:560px}
.roof{display:none;margin:0 -3%;height:64px}
.house[data-h=cottage]{--frame:#b77b4a}.house[data-h=cottage] .roof{display:block;background:#9c5f33;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house[data-h=mushroom]{--frame:#f3e3c8}.house[data-h=mushroom] .roof{display:block;height:84px;background:radial-gradient(circle at 28% 55%,#fff 9px,transparent 10px),radial-gradient(circle at 62% 38%,#fff 12px,transparent 13px),radial-gradient(circle at 80% 70%,#fff 7px,transparent 8px),#e8453c;border-radius:50% 50% 14px 14px/100% 100% 14px 14px}
.house[data-h=twostory]{--frame:#d9e6f7}.house[data-h=twostory] .roof{display:block;height:72px;background:linear-gradient(90deg,transparent 72%,#8a5f3c 72% 80%,transparent 80%) 0 0/100% 40% no-repeat,#4f7fc4;clip-path:polygon(50% 0,72% 0,72% 20%,80% 20%,80% 34%,100% 100%,0 100%)}
.house[data-h=castle]{--frame:#b9b3b8}.house[data-h=castle] .roof{display:block;height:58px;background:#a49da2;clip-path:polygon(0 100%,0 30%,10% 30%,10% 0,20% 0,20% 30%,30% 30%,30% 0,40% 0,40% 30%,60% 30%,60% 0,70% 0,70% 30%,80% 30%,80% 0,90% 0,90% 30%,100% 30%,100% 100%)}
.room{position:relative;aspect-ratio:4/3;overflow:hidden;border:7px solid var(--frame);border-radius:0 0 22px 22px;touch-action:pan-y}
.house[data-h=room] .room{border-radius:22px}
.wallp{position:absolute;inset:0 0 36% 0}.floorp{position:absolute;inset:64% 0 0 0;box-shadow:inset 0 6px 0 rgba(0,0,0,.06)}
.it{position:absolute;transform:translate(-50%,-100%);aspect-ratio:1;user-select:none}.it svg{width:100%;height:100%;display:block}
.it.flat{transform:translate(-50%,-60%)}
.room.edit .it{cursor:grab;touch-action:none}.room.edit .it.sel{outline:3px dashed var(--acc);outline-offset:2px;border-radius:10px}
.homeacts{margin-top:12px;align-items:center}.capn{margin-left:auto;font:400 15px Jua,sans-serif;color:var(--mut)}
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.tray button{flex:none;width:78px;border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:6px;display:grid;justify-items:center}
.tray svg{width:46px;height:46px}.tray small{font-size:12px}
.shoptabs{margin-bottom:12px}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.good{display:grid;justify-items:center;gap:4px;text-align:center;padding:12px 8px;border-radius:20px;background:var(--card);box-shadow:0 3px 0 var(--line)}
.good svg{width:58px;height:58px}.good b{font:400 17px Jua,sans-serif;font-weight:400}.good small{font-size:12px;color:var(--mut)}
.sw{width:58px;height:58px;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.hsw{width:64px;height:58px;display:grid;align-content:end}.hsw i{display:block;height:28px;background:#f3e3c8;border-radius:0 0 8px 8px}
.hsw::before{content:"";height:26px;display:block}
.hsw[data-h=cottage]::before{background:#9c5f33;clip-path:polygon(50% 0,100% 100%,0 100%)}
.hsw[data-h=mushroom]::before{background:radial-gradient(circle at 40% 55%,#fff 4px,transparent 5px),#e8453c;border-radius:50% 50% 4px 4px/100% 100% 4px 4px}
.hsw[data-h=twostory]::before{background:#4f7fc4;clip-path:polygon(50% 0,100% 100%,0 100%)}.hsw[data-h=twostory] i{height:34px;background:#d9e6f7}
.hsw[data-h=castle]::before{background:#a49da2;clip-path:polygon(0 100%,0 30%,20% 30%,20% 0,40% 0,40% 30%,60% 30%,60% 0,80% 0,80% 30%,100% 30%,100% 100%)}.hsw[data-h=castle] i{background:#b9b3b8}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font:400 17px Jua,sans-serif;transition:.25s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
#toast.show{transform:translate(-50%,0);opacity:1}
#sync{font-size:14px;color:var(--mut);margin-top:28px;text-align:center}
/* 첫 화면 */
#setup{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 20px 32px;background:var(--pink)}
#setup .card{width:min(100%,440px);background:var(--card);border-radius:32px;padding:28px 22px;text-align:center;box-shadow:0 6px 0 color-mix(in srgb,var(--pinkD) 40%,transparent)}
#setup .party svg{width:56px;height:56px}
#setup p{color:var(--mut)}
#setup .or{margin:18px 0 10px;font:400 15px Jua,sans-serif;color:var(--mut)}
#setup form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
#setup input{text-transform:uppercase;letter-spacing:.1em;text-align:center}
@media(max-width:600px){.meter{padding:14px;gap:12px}.radd{grid-template-columns:minmax(0,1fr) 5.5em}.radd .btn{grid-column:1/-1}.lb{grid-template-columns:36px 3.6em minmax(0,1fr) 3.2em}}
</style>
</head>
<body>
<section id="setup" hidden>
  <div class="card">
    <div class="party" id="setupParty"></div>
    <h1>우리집 집안일</h1>
    <p>다섯 식구가 같은 판을 함께 써요.<br>한 사람이 가족을 만들고, 나머지는 코드로 들어오면 돼요.</p>
    <button class="btn" id="create" style="width:100%">새 가족 만들기</button>
    <p class="or">이미 가족 코드가 있다면</p>
    <form id="join"><input type="text" id="joinCode" maxlength="9" placeholder="ABCD-2345" autocomplete="off" aria-label="가족 코드"><button class="btn ghost">참여</button></form>
    <p id="setupMsg" role="status"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="row"><div><h1>우리집 집안일</h1><p class="date" id="date"></p></div><div class="peek" id="peek"></div></div>
    <p class="melabel">나는 누구?</p>
    <div id="me"></div>
  </div></header>
  <nav><div class="wrap">
    <button data-t="todo">할 일</button>
    <button data-t="score">점수</button>
    <button data-t="play">놀이</button>
    <button data-t="home">우리집</button>
    <button data-t="manage">관리</button>
  </div></nav>
  <main><div class="wrap"><div id="view"></div><p id="sync"></p></div></main>
</div>
<div id="pin" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div id="pinFace" class="pinface"></div><h3 id="pinTitle"></h3><p id="pinSub"></p>
  <input type="password" id="pinIn" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="비밀번호 4자리">
  <p id="pinMsg" role="status"></p>
  <div class="acts"><button class="btn" id="pinOk">확인</button><button class="btn ghost" id="pinNo">취소</button></div>
</div></div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
